name: Slack team workflow QA
on:
  pull_request:
    paths:
      - 'scripts/slack-team/**'
      - 'scripts/slack-team-qa.mjs'
      - 'config/slack-team*'
      - '.github/workflows/slack-team-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/slack-team-qa.mjs
      - run: node scripts/txkpro-confirmation-runtime-test.mjs
      - run: node scripts/txkpro-orchestration-runtime-test.mjs
