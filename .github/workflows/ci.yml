            PATH="$TEST_BIN:$PATH" TXKPRO_CI_PRESENT="yes" \
              node scripts/txkpro-confirmation-check.mjs \
              --evidence "$RUNNER_TEMP/mismatched-confirmations.json"
          )"
          MISMATCH_COMMAND="node scripts/txkpro-confirmation-check.mjs --evidence $RUNNER_TEMP/mismatched-confirmations.json"
          node - "$MISMATCH_COMMAND" "$RUNNER_TEMP/pre-mismatch-input.json" <<'NODE'
          const fs = require("node:fs");
          const [command, outputPath] = process.argv.slice(2);
          fs.writeFileSync(
            outputPath,
            JSON.stringify({
              taskId: "task-123",
              preToolUse: {
                toolName: "run_commands",
                parameters: {command}
              }
            }),
          );
          NODE
          TMPDIR="$HOOK_TMP" node .cline/hooks/PreToolUse \
            < "$RUNNER_TEMP/pre-mismatch-input.json" > "$RUNNER_TEMP/mismatch-arm-result.json"
          node - "$mismatch_output" "$RUNNER_TEMP/post-mismatch-input.json" <<'NODE'
          const fs = require("node:fs");
          const [result, outputPath] = process.argv.slice(2);
          fs.writeFileSync(
            outputPath,
            JSON.stringify({
              taskId: "task-123",
              postToolUse: {
                toolName: "run_commands",
                result,
                success: true,
                executionTimeMs: 1
              }
            }),
          );
          NODE
          mismatch_post_result="$(
            TMPDIR="$HOOK_TMP" node .cline/hooks/PostToolUse \
              < "$RUNNER_TEMP/post-mismatch-input.json"
          )"
          printf '%s' "$mismatch_post_result" | grep -F 'issue/task identity does not match'
          GATE_PATH="$HOOK_TMP/txkpro-cline-confirmation-gates/task-123.json" node - <<'NODE'
          const fs = require("node:fs");
          const gate = JSON.parse(fs.readFileSync(process.env.GATE_PATH, "utf8"));
          if (gate.state !== "READ_ONLY_CONFIRMATIONS_REQUIRED") {
            throw new Error("mismatched issue/task validator result cleared the gate");
          }
          NODE

          TMPDIR="$HOOK_TMP" node .cline/hooks/PreToolUse \
            < "$RUNNER_TEMP/pre-validator-input.json" > "$RUNNER_TEMP/valid-arm-result.json"
          node - "$confirmation_output" "$RUNNER_TEMP/post-tool-input.json" <<'NODE'
          const fs = require("node:fs");
          const [output, outputPath] = process.argv.slice(2);
          fs.writeFileSync(
            outputPath,
            JSON.stringify({
              taskId: "task-123",
              postToolUse: {
                toolName: "run_commands",
                result: output,
                success: true,
                executionTimeMs: 1
              }
            }),
          );
          NODE

          post_result="$(
            TMPDIR="$HOOK_TMP" node .cline/hooks/PostToolUse \
              < "$RUNNER_TEMP/post-tool-input.json"
          )"
          printf '%s' "$post_result" | grep -F 'machine validation cleared'
          printf '%s' "$post_result" | grep -F 'Prose cannot upgrade'

          GATE_PATH="$HOOK_TMP/txkpro-cline-confirmation-gates/task-123.json" node - <<'NODE'
          const fs = require("node:fs");
          const gate = JSON.parse(fs.readFileSync(process.env.GATE_PATH, "utf8"));
          if (gate.state !== "CONFIRMED_AWAITING_APPROVAL") {
            throw new Error("valid structured validator result did not clear gate");
          }
          if (gate.issue !== 53 || gate.roadmapTaskId !== "W11-04B") {
            throw new Error("cleared gate identity mismatch");
          }
          if (gate.confirmationResult !== "CONFIRMED" || gate.planResult !== "CONFIRMED") {
            throw new Error("cleared gate did not persist confirmation/plan results");
          }
          if (!gate.validatorSuccess) throw new Error("validator success was not persisted");
          if (!/^[a-f0-9]{64}$/.test(gate.validationId || "")) {
            throw new Error("validation ID missing");
          }
          if (!/^[a-f0-9]{64}$/.test(gate.evidenceDigest || "")) {
            throw new Error("evidence digest missing");
          }
          const keys = [
            "rolesAndScopes",
            "dataOwnership",
            "statusesAndEvents",
            "iaAndDesign",
            "stagingTargets",
            "credentials",
            "manualUat",
            "unresolvedDecisions",
          ];
          for (const key of keys) {
            const confirmation = gate.validatedConfirmations?.[key];
            if (confirmation?.status !== "CONFIRMED") {
              throw new Error("missing confirmed audit for " + key);
            }
            const entry = confirmation.validatedEvidence?.[0];
            if (
              !entry?.source ||
              !entry?.assertion?.subject ||
              !entry?.assertion?.predicate ||
              !Array.isArray(entry?.assertion?.values) ||
              !entry?.verification?.type ||
              entry?.verification?.result !== "PASS"
            ) {
              throw new Error("incomplete validation audit for " + key);
            }
          }
          if (!Array.isArray(gate.validatedImplementationPlan?.decisions)) {
            throw new Error("validated implementation plan was not persisted");
          }
          const proposed = gate.validatedImplementationPlan.decisions.find(
            (decision) => decision.basis === "PROPOSED",
          );
          if (
            proposed?.label !== "PROPOSED — requires product/technical decision"
          ) {
            throw new Error("PROPOSED decision label was not preserved");
          }
          for (const required of [
            "Next eligible task confirmed: W11-04B / #53",
            "Automated Definition of Ready: PASS",
            "Read-only confirmations: CONFIRMED",
            "Implementation plan contract: CONFIRMED",
            "Mutation authorized: NO",
            "Validation audit:",
            "Validated implementation plan:",
          ]) {
            if (!gate.ownerFacingResponse?.includes(required)) {
              throw new Error("owner-facing response missing: " + required);
            }
          }
          NODE

          node - "$HOOK_TMP/txkpro-cline-confirmation-gates/task-123.json" "$RUNNER_TEMP/pre-extra-completion-input.json" <<'NODE'
          const fs = require("node:fs");
          const [gatePath, outputPath] = process.argv.slice(2);
          const gate = JSON.parse(fs.readFileSync(gatePath, "utf8"));
          fs.writeFileSync(
            outputPath,
            JSON.stringify({
              taskId: "task-123",
              preToolUse: {
                toolName: "attempt_completion",
                parameters: {
                  result:
                    gate.ownerFacingResponse +
                    "\napi_route=/invented-after-validation"
                }
              }
            }),
          );
          NODE
          extra_completion_result="$(
            TMPDIR="$HOOK_TMP" node .cline/hooks/PreToolUse \
              < "$RUNNER_TEMP/pre-extra-completion-input.json"
          )"
          printf '%s' "$extra_completion_result" | grep -F '"cancel":true'
          printf '%s' "$extra_completion_result" | grep -F 'does not exactly match'

          node - "$HOOK_TMP/txkpro-cline-confirmation-gates/task-123.json" "$RUNNER_TEMP/pre-exact-completion-input.json" <<'NODE'
          const fs = require("node:fs");
          const [gatePath, outputPath] = process.argv.slice(2);
          const gate = JSON.parse(fs.readFileSync(gatePath, "utf8"));
          fs.writeFileSync(
            outputPath,
            JSON.stringify({
              taskId: "task-123",
              preToolUse: {
                toolName: "attempt_completion",
                parameters: {result: gate.ownerFacingResponse}
              }
            }),
          );
          NODE
          allowed_result="$(
            TMPDIR="$HOOK_TMP" node .cline/hooks/PreToolUse \
              < "$RUNNER_TEMP/pre-exact-completion-input.json"
          )"
          printf '%s' "$allowed_result" | grep -F '"cancel":false'

          node - <<'NODE'
          const fs = require("node:fs");
          const template = JSON.parse(
            fs.readFileSync(".github/TXKPRO_READONLY_CONFIRMATION_TEMPLATE.json", "utf8"),
          );
          if (template.evidenceContract !== "semantic-provenance-v3") {
            throw new Error("confirmation template must use semantic-provenance-v3");
          }
          if (template.implementationPlan?.contract !== "sourced-plan-v1") {
            throw new Error("confirmation template must use sourced-plan-v1");
          }
          for (const [key, confirmation] of Object.entries(template.confirmations || {})) {
            const entry = confirmation.evidence?.[0];
            if (!entry || typeof entry !== "object" || Array.isArray(entry)) {
              throw new Error(key + " template evidence must be a structured object");
            }
            for (const field of ["source", "locator", "checkType", "finding", "assertion", "verification"]) {
              if (!(field in entry)) {
                throw new Error(key + " template is missing provenance field: " + field);
              }
            }
            for (const field of ["subject", "predicate", "values"]) {
              if (!(field in entry.assertion)) {
                throw new Error(key + " template assertion is missing field: " + field);
              }
            }
          }
          NODE

      - name: Validate per-run agent token usage lifecycle
        run: |
          USAGE_STATE="$RUNNER_TEMP/agent-usage-state"
          mkdir -p "$USAGE_STATE"

          cat > "$RUNNER_TEMP/usage-issue.json" <<'JSON'
          {
            "number": 53,
            "title": "[W11-04B] Build public Employer course and lesson URLs with SEO",
            "body": "**Task ID:** W11-04B\n**Dependencies:** W11-01B, W11-04A\n## Acceptance Criteria\n- [ ] public SEO routes"
          }
          JSON

          cat > "$RUNNER_TEMP/cline-usage.json" <<'JSON'
          [
            {
              "id": "usage-task-123",
              "tokensIn": 240000,
              "tokensOut": 60000,
              "cacheReads": 80000,
              "cacheWrites": 0,
              "totalCost": 0.1234,
              "modelId": "deepseek/deepseek-chat",
              "ts": 1790820000000
            }
          ]
          JSON

          TXKPRO_AGENT_USAGE_STATE_DIR="$USAGE_STATE" \
            CLINE_PLAN_MODEL="qwen/qwen3-coder" \
            CLINE_ACT_MODEL="deepseek/deepseek-chat" \
            node scripts/txkpro-agent-usage.mjs start \
              --issue 53 \
              --task-id W11-04B \
              --cline-task-id usage-task-123 \
              --issue-file "$RUNNER_TEMP/usage-issue.json" \
              --no-sync \
              > "$RUNNER_TEMP/usage-start.txt"

          grep -F 'TXKPRO_USAGE_RUN_STARTED' "$RUNNER_TEMP/usage-start.txt"

          TXKPRO_AGENT_USAGE_STATE_DIR="$USAGE_STATE" \
            node scripts/txkpro-agent-usage.mjs observe \
              --cline-task-id usage-task-123 \
              --success false \
              --execution-ms 1250 \
              --usage-file "$RUNNER_TEMP/cline-usage.json" \
              > "$RUNNER_TEMP/usage-observe.json"

          TXKPRO_AGENT_USAGE_STATE_DIR="$USAGE_STATE" \
            node scripts/txkpro-agent-usage.mjs finish \
              --cline-task-id usage-task-123 \
              --outcome verification \
              --usage-file "$RUNNER_TEMP/cline-usage.json" \
              --no-sync \
              > "$RUNNER_TEMP/usage-finish.txt"

          grep -F 'TXKPRO_USAGE_RUN_FINISHED' "$RUNNER_TEMP/usage-finish.txt"

          STATE_PATH="$USAGE_STATE/usage-task-123.json" node - <<'NODE'
          const fs = require("node:fs");
          const state = JSON.parse(fs.readFileSync(process.env.STATE_PATH, "utf8"));
          if (state.state !== "FINISHED") throw new Error("usage run did not finish");
          if (state.actual?.tokensIn !== 240000) throw new Error("input tokens mismatch");
          if (state.actual?.tokensOut !== 60000) throw new Error("output tokens mismatch");
          if (state.actual?.totalTokens !== 300000) throw new Error("cache tokens were incorrectly double-counted");
          if (state.actual?.cacheReads !== 80000) throw new Error("cache read telemetry missing");
          if (state.actual?.totalCostUsd !== 0.1234) throw new Error("cost telemetry mismatch");
          if (state.operations?.toolCalls !== 1) throw new Error("tool-call observation missing");
          if (state.operations?.failedToolCalls !== 1) throw new Error("failed-tool observation missing");
          if (state.operations?.toolExecutionMs !== 1250) throw new Error("tool execution time mismatch");
          NODE

          node - <<'NODE'
          const fs = require("node:fs");
          const policy = JSON.parse(fs.readFileSync("config/txkpro-agent-policy.json", "utf8"));
          if (policy.agentUsageTelemetry?.requiredForEveryImplementationRun !== true) {
            throw new Error("agent usage telemetry must be mandatory for every implementation run");
          }
          if (policy.agentUsageTelemetry?.postRun?.tokenAccounting !== "tokensIn_plus_tokensOut_cache_reported_separately") {
            throw new Error("token accounting policy must avoid cache double-counting");
          }
          NODE

      - name: Validate direct roadmap implementation auto-starts usage tracking
        run: |
          DIRECT_STATE="$RUNNER_TEMP/direct-usage-state"
          DIRECT_TMP="$RUNNER_TEMP/direct-hook-tmp"
          mkdir -p "$DIRECT_STATE" "$DIRECT_TMP"

          cat > "$RUNNER_TEMP/direct-usage-issue.json" <<'JSON'
          {
            "number": 53,
            "title": "[W11-04B] Build public Employer course and lesson URLs with SEO",
            "body": "**Task ID:** W11-04B\n**Dependencies:** W11-01B, W11-04A\n## Acceptance Criteria\n- [ ] public SEO routes"
          }
          JSON

          direct_result="$(
            TMPDIR="$DIRECT_TMP" \
            TXKPRO_AGENT_USAGE_STATE_DIR="$DIRECT_STATE" \
            TXKPRO_AGENT_USAGE_NO_SYNC="true" \
            TXKPRO_AGENT_USAGE_ISSUE_FILE="$RUNNER_TEMP/direct-usage-issue.json" \
            CLINE_PLAN_MODEL="qwen/qwen3-coder" \
            CLINE_ACT_MODEL="deepseek/deepseek-chat" \
            node .cline/hooks/UserPromptSubmit <<'JSON'
          {"taskId":"direct-task-456","userPromptSubmit":{"prompt":"Implement W11-04B"}}
          JSON
          )"

          printf '%s' "$direct_result" | grep -F 'PRE-RUN token estimate has been recorded'

          STATE_PATH="$DIRECT_STATE/direct-task-456.json" node - <<'NODE'
          const fs = require("node:fs");
          const state = JSON.parse(fs.readFileSync(process.env.STATE_PATH, "utf8"));
          if (state.state !== "ACTIVE") throw new Error("direct implementation usage run did not start");
          if (state.issue !== 53) throw new Error("direct implementation did not resolve issue #53");
          if (state.taskId !== "W11-04B") throw new Error("direct implementation did not retain Task ID");
          NODE

          GATE_PATH="$DIRECT_TMP/txkpro-cline-confirmation-gates/direct-task-456.json" node - <<'NODE'
          const fs = require("node:fs");
          const gate = JSON.parse(fs.readFileSync(process.env.GATE_PATH, "utf8"));
          if (gate.state !== "IMPLEMENTATION_RUN_ACTIVE") {
            throw new Error("direct implementation hook did not activate run gate");
          }
          if (gate.issue !== 53 || gate.roadmapTaskId !== "W11-04B") {
            throw new Error("direct implementation gate did not persist issue/task identity");
          }
          NODE

