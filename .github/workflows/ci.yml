name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash -n .devcontainer/bootstrap-agent.sh .devcontainer/start-agent.sh .devcontainer/discord-access-hook.sh
      - run: node --check .devcontainer/configure-cline.mjs
      - run: node --check scripts/roadmap-next-planned.mjs
      - run: node --check scripts/repo-latest.mjs
      - run: node --check scripts/lib/txkpro-evidence.mjs
      - run: node --check scripts/txkpro-task-context.mjs
      - run: node --check scripts/txkpro-preflight.mjs
      - run: node --check scripts/txkpro-wave-manifest.mjs
      - run: node --check scripts/txkpro-protocol-check.mjs
      - run: node --check scripts/txkpro-completion-report.mjs
      - run: node --check scripts/txkpro-project-transition.mjs
      - name: Syntax check Project sync GitHub Script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/project-sync.yml")
          lines = path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "script: |")
          base = len(lines[start]) - len(lines[start].lstrip())
          block = []

          for line in lines[start + 1:]:
            indent = len(line) - len(line.lstrip())
            if line.strip() and indent <= base:
              break
            block.append(line)

          nonblank = [line for line in block if line.strip()]
          strip = min(len(line) - len(line.lstrip()) for line in nonblank)
          script = "\n".join(line[strip:] if line.strip() else "" for line in block) + "\n"
          Path("/tmp/project-sync-script.js").write_text(script)
          PY

          node --check /tmp/project-sync-script.js
      - name: Validate TXKPRO protocol evidence gates
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const template = JSON.parse(
            fs.readFileSync(".github/TXKPRO_PROTOCOL_EVIDENCE_TEMPLATE.json", "utf8"),
          );

          const verification = structuredClone(template);
          verification.issue = 42;
          verification.task_id = "W12-03";
          verification.generated_at = new Date().toISOString();
          verification.target_status = "Verification";
          verification.verification.manual_uat = "remaining";
          verification.verification.acceptance_criteria = "pending";
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/verification.json",
            JSON.stringify(verification, null, 2),
          );

          const done = structuredClone(verification);
          done.target_status = "Done";
          done.verification.manual_uat = "passed";
          done.verification.acceptance_criteria = "met";
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/done.json",
            JSON.stringify(done, null, 2),
          );

          const invalid = structuredClone(done);
          invalid.blockers = ["Unresolved security blocker"];
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/invalid.json",
            JSON.stringify(invalid, null, 2),
          );
          NODE

          node scripts/txkpro-protocol-check.mjs             --evidence "$RUNNER_TEMP/verification.json"
          node scripts/txkpro-protocol-check.mjs             --evidence "$RUNNER_TEMP/done.json"

          node scripts/txkpro-completion-report.mjs             --evidence "$RUNNER_TEMP/verification.json"             | grep -F '<!-- txkpro-protocol-evidence:v1 -->'

          if node scripts/txkpro-protocol-check.mjs             --evidence "$RUNNER_TEMP/invalid.json"; then
            echo "Invalid Done evidence unexpectedly passed" >&2
            exit 1
          fi

          grep -F 'Closure alone does not prove Done' .github/workflows/project-sync.yml
          node -e 'JSON.parse(require("fs").readFileSync(".github/txkpro-protocol-evidence.schema.json","utf8")); JSON.parse(require("fs").readFileSync("config/txkpro-agent-policy.json","utf8"));'
      - name: Validate live repository discovery without worktree mutation
        run: |
          REMOTE="$RUNNER_TEMP/repo-latest-remote.git"
          SEED="$RUNNER_TEMP/repo-latest-seed"
          CLONE="$RUNNER_TEMP/repo-latest-clone"

          git init --bare "$REMOTE"
          git init "$SEED"
          git -C "$SEED" config user.name "TXKPRO CI"
          git -C "$SEED" config user.email "ci@txkpro.local"
          printf 'base\n' > "$SEED/README.md"
          git -C "$SEED" add README.md
          git -C "$SEED" commit -m "base"
          git -C "$SEED" branch -M main
          git -C "$SEED" remote add origin "$REMOTE"
          git -C "$SEED" push -u origin main
          git --git-dir="$REMOTE" symbolic-ref HEAD refs/heads/main

          git clone "$REMOTE" "$CLONE"
          BASE_SHA="$(git -C "$CLONE" rev-parse HEAD)"

          mkdir -p "$SEED/docs"
          printf 'AUTHORITATIVE DESIGN SOURCE\n' > "$SEED/docs/NEW_DESIGN_DOC.txt"
          git -C "$SEED" add docs/NEW_DESIGN_DOC.txt
          git -C "$SEED" commit -m "add remote-only design doc"
          git -C "$SEED" push origin main

          printf 'local-only-change\n' >> "$CLONE/README.md"

          (
            cd "$CLONE"
            node "$GITHUB_WORKSPACE/scripts/repo-latest.mjs" find NEW_DESIGN_DOC.txt               | grep -Fx "docs/NEW_DESIGN_DOC.txt"
            node "$GITHUB_WORKSPACE/scripts/repo-latest.mjs" read docs/NEW_DESIGN_DOC.txt               | grep -Fx "AUTHORITATIVE DESIGN SOURCE"
          )

          test "$(git -C "$CLONE" rev-parse HEAD)" = "$BASE_SHA"
          grep -Fx "local-only-change" "$CLONE/README.md"
          test "$(git -C "$CLONE" status --short README.md)" = " M README.md"
      - name: Validate Cline model token overrides
        env:
          CLINE_PLAN_MODEL: qwen/qwen3-coder
          CLINE_ACT_MODEL: deepseek/deepseek-chat
          CLINE_PLAN_MAX_TOKENS: "8192"
          CLINE_ACT_MAX_TOKENS: "16384"
        run: |
          TEST_HOME="$RUNNER_TEMP/cline-config-test"
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" node .devcontainer/configure-cline.mjs
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const modelsPath = path.join(
            process.env.RUNNER_TEMP,
            "cline-config-test",
            ".cline",
            "data",
            "settings",
            "models.json",
          );
          const models = JSON.parse(fs.readFileSync(modelsPath, "utf8"));
          const overrides = models.providers?.openrouter?.models ?? {};
          if (overrides["qwen/qwen3-coder"]?.maxTokens !== 8192) {
            throw new Error("Plan model maxTokens override was not persisted");
          }
          if (overrides["deepseek/deepseek-chat"]?.maxTokens !== 16384) {
            throw new Error("Act model maxTokens override was not persisted");
          }
          NODE
      - name: Validate authoritative roadmap selection
        run: |
          TEST_BIN="$RUNNER_TEMP/roadmap-bin"
          mkdir -p "$TEST_BIN"

          cat > "$TEST_BIN/gh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${GH_TOKEN:-}" != "test-project-token" ]]; then
            echo "roadmap helper did not isolate PROJECTS_TOKEN as GH_TOKEN" >&2
            exit 9
          fi
          cat <<'JSON'
          {
            "data": {
              "user": {
                "projectV2": {
                  "id": "PVT_test",
                  "title": "TXKPRO Product Roadmap",
                  "items": {
                    "nodes": [
                      {
                        "id": "item_done",
                        "createdAt": "2026-09-01T00:00:00Z",
                        "fieldValues": {
                          "nodes": [
                            {
                              "name": "Done",
                              "field": {"name": "Status"}
                            }
                          ]
                        },
                        "content": {
                          "number": 20,
                          "title": "Older done issue",
                          "state": "OPEN",
                          "createdAt": "2026-08-01T00:00:00Z",
                          "body": "**Dependencies:** None",
                          "url": "https://github.com/QaloriHQ/txkpro-workforce/issues/20",
                          "repository": {"nameWithOwner": "QaloriHQ/txkpro-workforce"}
                        }
                      },
                      {
                        "id": "item_closed",
                        "createdAt": "2026-09-02T00:00:00Z",
                        "fieldValues": {
                          "nodes": [
                            {
                              "name": "Planned",
                              "field": {"name": "Status"}
                            }
                          ]
                        },
                        "content": {
                          "number": 10,
                          "title": "Closed planned issue",
                          "state": "CLOSED",
                          "createdAt": "2026-07-01T00:00:00Z",
                          "body": "**Dependencies:** None",
                          "url": "https://github.com/QaloriHQ/txkpro-workforce/issues/10",
                          "repository": {"nameWithOwner": "QaloriHQ/txkpro-workforce"}
                        }
                      },
                      {
                        "id": "item_next",
                        "createdAt": "2026-09-10T00:00:00Z",
                        "fieldValues": {
                          "nodes": [
                            {
                              "name": "Planned",
                              "field": {"name": "Status"}
                            }
                          ]
                        },
                        "content": {
                          "number": 30,
                          "title": "[W11-15] Run Employer Learning security and UX QA",
                          "state": "OPEN",
                          "createdAt": "2026-08-20T00:00:00Z",
                          "body": "## Roadmap metadata\n- **Dependencies:** W11-13",
                          "url": "https://github.com/QaloriHQ/txkpro-workforce/issues/30",
                          "repository": {"nameWithOwner": "QaloriHQ/txkpro-workforce"}
                        }
                      },
                      {
                        "id": "item_later",
                        "createdAt": "2026-09-20T00:00:00Z",
                        "fieldValues": {
                          "nodes": [
                            {
                              "name": "Planned",
                              "field": {"name": "Status"}
                            }
                          ]
                        },
                        "content": {
                          "number": 90,
                          "title": "Later planned issue",
                          "state": "OPEN",
                          "createdAt": "2026-08-10T00:00:00Z",
                          "body": "**Dependencies:** W14-25",
                          "url": "https://github.com/QaloriHQ/txkpro-workforce/issues/90",
                          "repository": {"nameWithOwner": "QaloriHQ/txkpro-workforce"}
                        }
                      }
                    ],
                    "pageInfo": {
                      "hasNextPage": false,
                      "endCursor": null
                    }
                  }
                }
              }
            }
          }
          JSON
          SH
          chmod +x "$TEST_BIN/gh"

          PATH="$TEST_BIN:$PATH" \
            PROJECTS_TOKEN="test-project-token" \
            TXKPRO_ROADMAP_OWNER="QaloriHQ" \
            TXKPRO_ROADMAP_PROJECT_NUMBER="1" \
            TXKPRO_ROADMAP_REPO="QaloriHQ/txkpro-workforce" \
            node scripts/roadmap-next-planned.mjs --json > "$RUNNER_TEMP/roadmap-result.json"

          RESULT_PATH="$RUNNER_TEMP/roadmap-result.json" node - <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, "utf8"));
          if (result.issue !== 30) {
            throw new Error(`Expected earliest-added Planned issue #30, received #${result.issue}`);
          }
          if (result.projectStatus !== "Planned") {
            throw new Error("Roadmap status was not read from the Project field");
          }
          if (result.dependencies !== "W11-13") {
            throw new Error(`Unexpected dependencies: ${result.dependencies}`);
          }
          NODE
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
